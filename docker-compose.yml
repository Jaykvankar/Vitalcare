services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rpm
      POSTGRES_USER: rpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpm"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rpm:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/rpm
      RPM_SELF_URL: https://localhost:8443
      RPM_TLS_VERIFY: /app/certs/dev-cert.pem
    volumes:
      - ./certs:/app/certs:ro
      - rpmdata:/app/backend/data
      - simkeys:/app/simulator_keys
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  rpmdata:
  simkeys:
